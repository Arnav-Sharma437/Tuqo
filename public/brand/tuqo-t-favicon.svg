<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff333a"/>
      <stop offset="50%" stop-color="#e21b23"/>
      <stop offset="100%" stop-color="#b81017"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Modern dark squircle background with subtle bevel -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="none" stroke="#2a2e39" stroke-width="6"/>
  <rect x="22" y="22" width="468" height="234" rx="104" fill="url(#glowGrad)"/>

  <!-- Iconic TUQO 'T' with precise industrial angle cuts matching official branding -->
  <!-- 
    Path details:
    - Starts at top-left: (80, 120)
    - 45-deg chamfer down to under-wing: (156, 196)
    - Under-wing horizontal to stem: (230, 196)
    - Stem slants down-left: (158, 392)
    - Stem bottom horizontal: (246, 392)
    - Stem right edge slants up-right: (318, 196)
    - Right wing under-side horizontal: (380, 196)
    - Right wing angled outer cut: (432, 120)
    - Top edge horizontal back to start: (80, 120)
  -->
  <g>
    <!-- Subtle drop shadow on the T -->
    <path d="M 80 126 L 156 202 L 230 202 L 158 398 L 246 398 L 318 202 L 380 202 L 432 126 Z" 
          fill="#000000" opacity="0.45" />

    <!-- Main Vibrant Red T -->
    <path d="M 80 120 L 156 196 L 230 196 L 158 392 L 246 392 L 318 196 L 380 196 L 432 120 Z" 
          fill="url(#tGrad)" />

    <!-- Top highlight stroke for premium metallic finish -->
    <path d="M 82 123 L 430 123" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" stroke-linecap="round"/>
  </g>
</svg>